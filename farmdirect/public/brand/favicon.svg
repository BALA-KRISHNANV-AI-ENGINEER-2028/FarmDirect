<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64">
  <defs>
    <path id="fd-fav-green" d="M 0,0 C -3.6,-4 -4,-9.5 0,-14 C 4,-9.5 3.6,-4 0,0 Z" fill="#1A5336" />
    <path id="fd-fav-gold" d="M 0,0 C -3.6,-4 -4,-9.5 0,-14 C 4,-9.5 3.6,-4 0,0 Z" fill="#E5A812" />
  </defs>
  <!-- Central Stem -->
  <rect x="22.5" y="15" width="3" height="43" rx="1.5" fill="#1A5336" />
  <!-- Top Center Leaf -->
  <use href="#fd-fav-green" x="24" y="16" />
  <!-- Golden Inner Circles -->
  <circle cx="17.5" cy="19.5" r="2.7" fill="#E5A812" />
  <circle cx="30.5" cy="19.5" r="2.7" fill="#E5A812" />
  <!-- Golden Outer Tilted Grains -->
  <use href="#fd-fav-gold" transform="translate(21.5, 24) rotate(-45)" />
  <use href="#fd-fav-gold" transform="translate(26.5, 24) rotate(45)" />
  <!-- Middle Pair Green Leaves -->
  <use href="#fd-fav-green" transform="translate(22.5, 34.5) rotate(-45)" />
  <use href="#fd-fav-green" transform="translate(25.5, 34.5) rotate(45)" />
  <!-- Bottom Pair Green Leaves -->
  <use href="#fd-fav-green" transform="translate(22.5, 45.5) rotate(-45)" />
  <use href="#fd-fav-green" transform="translate(25.5, 45.5) rotate(45)" />
</svg>